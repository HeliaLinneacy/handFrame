<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport: no user-scaling, prevents double-tap zoom interfering with gestures -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="HandFrame AR - Dùng hai tay tạo khung hình chữ nhật và hiển thị ảnh realtime với MediaPipe Hand Tracking" />
    <meta name="keywords" content="hand tracking, AR, mediapipe, webcam, realtime, gesture" />
    <meta name="theme-color" content="#0f0f0f" />
    <!-- iOS Safari specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Permissions Policy: allow camera access in iframes if embedded -->
    <meta http-equiv="Permissions-Policy" content="camera=*" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>HandFrame AR — Real-time Hand Gesture Image Display</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
